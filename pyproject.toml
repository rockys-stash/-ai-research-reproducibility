[project]
name = "reprobench"
version = "0.1.0"
description = "AI research reproducibility benchmark: agent-written research rerun independently in clean environments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# Local open-weights language models through llama.cpp; only generating artifacts needs it.
llm = ["llama-cpp-python==0.3.36"]

[project.scripts]
reprobench = "reprobench.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml>=6.0",
  "pandas-stubs>=2.2",
  "playwright==1.56.0",
  "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reprobench"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["artifacts", "references", "reruns"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N803", "N806", "N812", "E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["reprobench"]
warn_return_any = false

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "llama_cpp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ui: browser tests (need built frontend + chromium)", "docker: needs a running Docker daemon"]
addopts = "-m 'not ui and not docker'"
